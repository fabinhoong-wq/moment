name: Relatorio mensal Moment (22h, ultimo dia do mes)

on:
  schedule:
    # 22:00 do ultimo dia do mes, horario de Brasilia = 01:00 UTC do
    # dia 1 do mes seguinte (sem horario de verao no Brasil)
    - cron: '0 1 1 * *'
  workflow_dispatch: {}   # permite disparar manualmente pra testar

jobs:
  enviar-relatorio-mensal:
    runs-on: ubuntu-latest
    steps:
      - name: Acordar o servico no Render (caso esteja hibernando)
        run: curl -s -o /dev/null "https://moment-dfs4.onrender.com/" || true

      - name: Esperar o servico responder
        run: sleep 20

      - name: Chamar a rota do relatorio mensal
        run: |
          curl -sf "https://moment-dfs4.onrender.com/send-monthly-report?secret=${{ secrets.REPORT_SECRET }}" \
            || (echo "Falhou, tentando de novo em 30s" && sleep 30 && curl -sf "https://moment-dfs4.onrender.com/send-monthly-report?secret=${{ secrets.REPORT_SECRET }}")
